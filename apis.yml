aid: tradingview
name: TradingView
description: >-
  TradingView is a charting, social, and market-data platform for traders and
  investors, and one of the most-visited finance sites in the world. Its
  developer surface is delivered primarily as client-side, embeddable UI
  components and self-hosted JavaScript charting libraries rather than a hosted
  market-data REST API: the open-source (Apache-2.0) Lightweight Charts library,
  the free self-hosted Advanced Charts (Charting Library) with its custom
  Datafeed API, the Trading Platform library, and a large catalog of copy-paste
  embeddable widgets (charts, tickers, heatmaps, screeners, economic calendars).
  For brokerages, TradingView publishes a Broker Integration REST API contract
  that a broker implements to enable order entry and account management directly
  from the chart. Client libraries ship on npm (lightweight-charts), with
  official iOS and Android wrappers, and the organization runs a self-hosted bug
  bounty program.
